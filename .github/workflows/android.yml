name: android

on:
  push:
    branches: ["phase-**", "feature-**", "fix-**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Accept licences + install platform
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-36"

      - name: Decode debug keystore (optional)
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            echo "$DEBUG_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
            echo "DEBUG_KEYSTORE_PATH=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
          else
            echo "No keystore secret; using default debug key."
          fi

      - name: Decode debug keystore (optional)
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            echo "$DEBUG_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
            echo "DEBUG_KEYSTORE_PATH=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
          else
            echo "No keystore secret; using default debug key."
          fi
      - name: Write local.properties (optional secrets)
        env:
          HERMES_PASSWORD: ${{ secrets.HERMES_PASSWORD }}
        run: |
          if [ -n "$HERMES_PASSWORD" ]; then
            # app/build.gradle.kts reads file("local.properties") relative to app/
            printf 'hermes.password=%s\n' "$HERMES_PASSWORD" > app/local.properties
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.8.1

      - name: Assemble debug
        run: gradle assembleDebug --stacktrace
        env:
          DEBUG_KEYSTORE_PATH: ${{ env.DEBUG_KEYSTORE_PATH }}
          DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
          DEBUG_KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS }}
          DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}

      - name: Lint
        run: gradle lintDebug

      - name: Unit tests
        run: gradle testDebugUnitTest

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hermes-debug
          path: app/build/outputs/apk/debug/*.apk
